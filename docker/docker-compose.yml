version: '3.8'

services:
  sbr-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
    volumes:
      - ../src:/app/src
    restart: unless-stopped

  # Optional: Firebase Emulator for local development
  firebase-emulator:
    image: oraoto/firebase-emulator
    ports:
      - "5000:5000"
      - "9099:9099"
    environment:
      - FIREBASE_PROJECT=${GCP_PROJECT_ID}
