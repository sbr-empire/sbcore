version: '3.8'

services:
  sbr-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SBR_NODE_ENV=development
      - SBR_PORT=8080
      - SBR_GCP_PROJECT_ID=${SBR_GCP_PROJECT_ID}
      - SBR_FIREBASE_API_KEY=${SBR_FIREBASE_API_KEY}
    volumes:
      - ../src:/app/src
    restart: unless-stopped

  # Optional: Firebase Emulator for local development
  firebase-emulator:
    image: oraoto/firebase-emulator
    ports:
      - "5000:5000"
      - "9099:9099"
    environment:
      - FIREBASE_PROJECT=${SBR_GCP_PROJECT_ID}
