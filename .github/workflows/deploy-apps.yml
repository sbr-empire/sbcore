name: Deploy Apps to Firebase Hosting

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: sbrempire-dced5

jobs:
  deploy-apps:
    if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: sbrhikmah, target: hikmah }
          - { app: sbrbeautyhub, target: beautyhub }
          - { app: sbrbioforge, target: bioforge }
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build
      working-directory: ./${{ matrix.app }}.com
      run: |
        npm install
        npm run build

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SBREMPIRE_DCED5 }}
        projectId: ${{ env.PROJECT_ID }}
        channelId: live
        target: ${{ matrix.target }}
      env:
        FIREBASE_CLI_PREVIEW: hostingchannels
