name: Deploy Three Separate Apps to GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: sbrempire-dced5
  REGION: asia-south2

jobs:
  deploy-apps:
    if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy Bioforge
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: sbrbioforge
        region: ${{ env.REGION }}
        source: ./sbrbioforge.com
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy Beautyhub
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: sbrbeautyhub
        region: ${{ env.REGION }}
        source: ./sbrbeautyhub.com
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy Hikmah
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: sbrhikmah
        region: ${{ env.REGION }}
        source: ./sbrhikmah.com
        project_id: ${{ env.PROJECT_ID }}
        
