name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sbrempire-dced5
  REGION: asia-south2
  SERVICE: sbcore

jobs:
  backend:
    name: Backend (Cloud Run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          cp docker/Dockerfile Dockerfile
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

  frontend:
    name: Frontend (Firebase Hosting - ${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [sbrhikmah, sbrbeautyhub, sbrbioforge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite app
        working-directory: ./${{ matrix.app }}.com
        run: |
          npm ci || npm install
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: |
          target="${APP#sbr}"
          [ "$target" = "hikmah" ] || [ "$target" = "beautyhub" ] || [ "$target" = "bioforge" ]
          npx --yes firebase-tools@latest deploy \
            --only "hosting:$target" \
            --project "$PROJECT_ID" \
            --non-interactive
        env:
          APP: ${{ matrix.app }}
